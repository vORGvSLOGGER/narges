<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>نرجس سوبرماركت</title>
    <script>
      // إعادة توجيه روابط SPA العميقة على GitHub Pages (طريقة spa-github-pages).
      // يحوّل المسار إلى استعلام ثم يعيد التوجيه لـ index.html ليلتقطه الراوتر.
      // pathSegmentsToKeep = 1 لأن الموقع منشور تحت مقطع المستودع /narges/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
